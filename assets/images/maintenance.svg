<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="mTitle mDesc">
  <title id="mTitle">Brewery maintenance illustration</title>
  <desc id="mDesc">Craft beer tank under maintenance with gears, wrench and beer mug</desc>
  <!-- background glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2620"/>
      <stop offset="55%" stop-color="#1c1916"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="24" fill="#0b0a09"/>
  <rect width="640" height="480" rx="24" fill="url(#glow)"/>

  <!-- floor -->
  <ellipse cx="320" cy="408" rx="210" ry="26" fill="#000" opacity="0.45"/>
  <ellipse cx="320" cy="404" rx="210" ry="22" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- main brew tank -->
  <g>
    <rect x="230" y="110" width="180" height="240" rx="60" fill="url(#tank)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="3"/>
    <!-- steel bands -->
    <rect x="230" y="175" width="180" height="12" fill="url(#steel)" opacity="0.9"/>
    <rect x="230" y="270" width="180" height="12" fill="url(#steel)" opacity="0.9"/>
    <!-- sight glass with beer -->
    <rect x="300" y="140" width="40" height="120" rx="20" fill="#0b0a09" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="305" y="170" width="30" height="85" rx="15" fill="url(#beer)"/>
    <circle cx="312" cy="200" r="4" fill="#fef3c7" opacity="0.8"/>
    <circle cx="321" cy="220" r="6" fill="#fef3c7" opacity="0.6"/>
    <circle cx="314" cy="238" r="3" fill="#fef3c7" opacity="0.8"/>
    <!-- LN badge -->
    <circle cx="320" cy="305" r="26" fill="#f59e0b"/>
    <text x="320" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#0b0a09">LN</text>
    <!-- legs -->
    <rect x="245" y="348" width="14" height="52" rx="6" fill="#57534e"/>
    <rect x="381" y="348" width="14" height="52" rx="6" fill="#57534e"/>
    <!-- top valve + steam -->
    <rect x="308" y="88" width="24" height="26" rx="6" fill="#78716c"/>
    <circle cx="320" cy="82" r="10" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <path d="M300 60 q10 -12 0 -24 M320 60 q10 -12 0 -24 M340 60 q10 -12 0 -24" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- left gear -->
  <g transform="translate(155,285)" fill="none" stroke="#f59e0b" stroke-width="8">
    <circle r="42" fill="#141210"/>
    <circle r="16" fill="#f59e0b" stroke="none"/>
    <g stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-34"/>
      <line x1="0" y1="34" x2="0" y2="58"/>
      <line x1="-58" y1="0" x2="-34" y2="0"/>
      <line x1="34" y1="0" x2="58" y2="0"/>
      <line x1="-41" y1="-41" x2="-24" y2="-24"/>
      <line x1="24" y1="24" x2="41" y2="41"/>
      <line x1="-41" y1="41" x2="-24" y2="24"/>
      <line x1="24" y1="-24" x2="41" y2="-41"/>
    </g>
  </g>

  <!-- wrench -->
  <g transform="translate(475,150) rotate(35)">
    <rect x="-14" y="-10" width="28" height="160" rx="14" fill="url(#steel)"/>
    <path d="M-22 -70 a22 22 0 1 1 44 0 l-12 18 -8 -8 -8 8 -8 -8 Z" fill="url(#steel)" stroke="#0b0a09" stroke-width="2"/>
    <circle cx="0" cy="130" r="9" fill="#0b0a09"/>
  </g>

  <!-- beer mug -->
  <g transform="translate(475,300)">
    <rect x="-40" y="-55" width="70" height="95" rx="10" fill="url(#beer)" stroke="#fef3c7" stroke-width="3"/>
    <rect x="-40" y="-75" width="70" height="28" rx="12" fill="#fef3c7" opacity="0.95"/>
    <circle cx="-25" cy="-78" r="10" fill="#fff"/>
    <circle cx="0" cy="-82" r="13" fill="#fff"/>
    <circle cx="22" cy="-76" r="9" fill="#fff"/>
    <path d="M30 -40 q35 0 30 40 q-5 32 -32 30" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round"/>
    <text x="-5" y="5" text-anchor="middle" font-family="Arial" font-weight="900" font-size="28" fill="#0b0a09">21+</text>
  </g>

  <!-- traffic cone -->
  <g transform="translate(120,360)">
    <polygon points="0,-70 30,20 -30,20" fill="#ea580c" stroke="#fef3c7" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-18" y="-40" width="36" height="14" fill="#fef3c7"/>
    <rect x="-38" y="20" width="76" height="14" rx="6" fill="#44403c"/>
  </g>

  <!-- progress bar -->
  <g transform="translate(170,60)">
    <rect width="300" height="26" rx="13" fill="#1c1916" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="4" y="4" width="195" height="18" rx="9" fill="#f59e0b"/>
    <text x="150" y="19" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#0b0a09">CLEANING FERMENTER… 65%</text>
  </g>

  <!-- floating sparks -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="200" cy="130" r="4"/>
    <circle cx="445" cy="230" r="5"/>
    <circle cx="230" cy="90" r="3"/>
    <circle cx="410" cy="100" r="3.5"/>
    <circle cx="545" cy="250" r="4"/>
  </g>
</svg>
